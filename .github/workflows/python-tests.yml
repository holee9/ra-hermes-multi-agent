# Python regression — hive contract v2.1 reference implementations (#150)
#
# Runs the isolated, network-free test files for tools/validate_events.py,
# tools/hive_router.py and tools/hive_drain.py on every push/PR. No secrets,
# no runtime access: these suites use temporary hives only.
#
# Scope note: this is the CI guard codex asked for on #150 — local "N passed"
# was not branch protection. Other Python suites that import scripts/ with
# runtime dependencies (Flask, Honcho URLs) are intentionally not here yet.

name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/test_validate_events.py"
      - "tests/test_hive_router.py"
      - "tests/test_hive_drain.py"
      - "tests/fixtures/**"
      - "docs/contract/event-v2.1.schema.json"
      - "virtual-office/mock/events-v2.1.jsonl"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/test_validate_events.py"
      - "tests/test_hive_router.py"
      - "tests/test_hive_drain.py"
      - "tests/fixtures/**"
      - "docs/contract/event-v2.1.schema.json"
      - "virtual-office/mock/events-v2.1.jsonl"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hive-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8" "jsonschema>=4.19"
      - name: Run hive regression (validator / router / drain)
        run: python -m pytest tests/test_validate_events.py tests/test_hive_router.py tests/test_hive_drain.py -q -p no:cacheprovider
