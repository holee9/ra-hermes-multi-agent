# Python regression — hive contract v2.1 reference implementations (#150)
#
# Runs the isolated, network-free test files for tools/validate_events.py,
# tools/hive_router.py and tools/hive_drain.py on every push/PR. No secrets,
# no runtime access: these suites use temporary hives only.
#
# Scope: the whole tests/ tree. Every suite mocks its I/O — a scan for un-mocked
# urlopen/requests/socket calls in tests/ returns nothing, so CI touches no Honcho,
# Qdrant, GX10 or GitHub endpoint. The skill-resolution regression skips on runners
# without Hermes profiles.

name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "scripts/**"
      - "tests/**"
      - "docs/contract/event-v2.1.schema.json"
      - "virtual-office/mock/events-v2.1.jsonl"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - "scripts/**"
      - "tests/**"
      - "docs/contract/event-v2.1.schema.json"
      - "virtual-office/mock/events-v2.1.jsonl"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hive-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >
          python -m pip install --disable-pip-version-check
          "pytest>=8" "jsonschema>=4.19" "flask>=3" "pyyaml>=6" "requests>=2.31" "psycopg2-binary>=2.9"
      - name: Run Python regression (tests/)
        run: python -m pytest tests -q -p no:cacheprovider
